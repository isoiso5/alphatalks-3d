name: Render 3D video

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique job id (becomes the release tag)"
        required: true
      composition:
        description: "Story3D (16:9) or Story3DShort (9:16)"
        required: true
        default: "Story3D"
      props:
        description: "JSON props, or 'file:<path>' to use a story file from the repo"
        required: true

permissions:
  contents: write

env:
  MODELS_BASE: https://raw.githubusercontent.com/NoLimitNexus/game-models/d188ebf93ceb3c4b95ba9bc6b1856cd1fd34915d

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      chunks: ${{ steps.prep.outputs.chunks }}
      minutes: ${{ steps.prep.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install edge-tts numpy
      - name: Save props
        env:
          PROPS: ${{ github.event.inputs.props }}
          COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          case "$COMPOSITION" in Story3D|Story3DShort) ;; *) echo "Bad composition"; exit 1;; esac
          case "$PROPS" in
            file:*) cp "${PROPS#file:}" props.json ;;
            *) printf '%s' "$PROPS" > props.json ;;
          esac
          python -c "import json; p=json.load(open('props.json')); assert p['scenes'], 'scenes required'"
      - name: Voiceover, captions timing and soundtrack
        id: prep
        run: python scripts/prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: |
            props.json
            out/audio.wav
          retention-days: 3

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      max-parallel: 18
      matrix:
        chunk: ${{ fromJSON(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prepared
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libgbm-dev fonts-dejavu
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Download 3D characters (KayKit, CC0)
        run: bash scripts/fetch-models.sh
      - name: Render chunk ${{ matrix.chunk.i }} (frames ${{ matrix.chunk.range }})
        env:
          COMPOSITION: ${{ github.event.inputs.composition }}
        run: |
          mkdir -p chunks
          npx remotion render src/index.ts "$COMPOSITION" "chunks/part-$(printf '%03d' ${{ matrix.chunk.i }}).mp4" \
            --props=props.json --frames=${{ matrix.chunk.range }} --muted \
            --gl=swangle --concurrency=4 --timeout=240000 --crf=18 --log=info
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: chunks/
          retention-days: 2

  finish:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libgbm-dev fonts-dejavu
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
          npm install --no-audit --no-fund
          npx remotion browser ensure
          bash scripts/fetch-models.sh
      - name: Stitch chunks + soundtrack
        run: |
          ls chunks/*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy video_silent.mp4
          ffmpeg -y -i video_silent.mp4 -i out/audio.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart video.mp4
          ls -la video.mp4
      - name: Render thumbnail
        run: npx remotion still src/index.ts Thumbnail thumbnail.png --props=props.json --gl=swangle --timeout=240000
        continue-on-error: true
      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          FILES="video.mp4"
          [ -f thumbnail.png ] && FILES="$FILES thumbnail.png"
          gh release create "$JOB_ID" $FILES --title "Render $JOB_ID" \
            --notes "Rendered by GitHub Actions — ${{ needs.prepare.outputs.minutes }} minutes" --latest=false
