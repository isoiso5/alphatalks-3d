name: Render 16x9 Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: Create Video
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1920x1080:d=10 \
          -vf "drawtext=text='TRADITION IS NOT TRUTH':fontcolor=white:fontsize=90:x=(w-text_w)/2:y=(h-text_h)/2" \
          -c:v libx264 \
          -pix_fmt yuv420p \
          output.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: output.mp4
