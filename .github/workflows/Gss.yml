name: Render AlphaTalks

on:
  push:
    paths:
      - "scripts/**"

  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render
        run: |
          mkdir -p output
          python3 render.py

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: alphatalks-render
          path: output/
