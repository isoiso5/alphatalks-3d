name: Render AlphaTalks

on:
  push:
    paths:
      - "scripts/**"

  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install -r requirements.txt

      - name: Render AlphaTalks
        run: |
          mkdir -p output
          python render.py

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: AlphaTalks-render
          path: output/
          if-no-files-found: error
