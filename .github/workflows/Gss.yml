name: Text Video

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: Create Video
        run: |
          ffmpeg -f lavfi -i color=c=black:s=1080x1920:d=20 \
          -vf "drawtext=text='TRADITION IS NOT TRUTH':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" \
          -c:v libx264 -pix_fmt yuv420p output.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
